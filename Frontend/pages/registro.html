<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | PETTO</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos PETTO -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- =========================
         NAVEGACIÓN
    ========================== -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand d-inline-flex align-items-center gap-2" href="index.html">
                <svg class="petto-logo-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="5.5" cy="7" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="11" cy="4.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="17" cy="5.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="20" cy="10" rx="2" ry="2.5"></ellipse>
                    <path d="M12 10c-3.5 0-7 4-7 7a3 3 0 0 0 4 2.8l3-1 3 1A3 3 0 0 0 19 17c0-3-3.5-7-7-7Z"></path>
                </svg>
                <span class="d-flex flex-column">
                    <span class="logo-petto">PETTO</span>
                    <small class="lema">EL CAMINO A CASA</small>
                </span>

            </a>

        </div>

    </nav>


    <!-- =========================
         FORMULARIO DE REGISTRO
    ========================== -->

    <main class="formulario-pagina">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7 col-md-9">

                    <div class="formulario-card">

                        <div class="text-center mb-4">

                            <div class="formulario-icono">
                                🐾
                            </div>

                            <h1>
                                Crear una cuenta
                            </h1>

                            <p>
                                Registrate en PETTO y ayudá a que más mascotas
                                puedan volver a casa.
                            </p>

                        </div>


                        <!-- FORMULARIO -->

                        <form id="formRegistro">

                            <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

                            <div class="row">

                                <!-- NOMBRE -->

                                <div class="col-md-6 mb-3">

                                    <label for="nombre" class="form-label">
                                        Nombre
                                    </label>

                                    <input 
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        class="form-control"
                                        placeholder="Ingresá tu nombre"
                                        required>

                                </div>


                                <!-- APELLIDO -->

                                <div class="col-md-6 mb-3">

                                    <label for="apellido" class="form-label">
                                        Apellido
                                    </label>

                                    <input 
                                        type="text"
                                        id="apellido"
                                        name="apellido"
                                        class="form-control"
                                        placeholder="Ingresá tu apellido"
                                        required>

                                </div>

                            </div>


                            <!-- DNI -->

                            <div class="mb-3">

                                <label for="dni" class="form-label">
                                    DNI
                                </label>

                                <input 
                                    type="text"
                                    id="dni"
                                    name="dni"
                                    class="form-control"
                                    placeholder="Ingresá tu DNI"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Correo electrónico
                                </label>

                                <input 
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="ejemplo@correo.com"
                                    required>

                            </div>


                            <!-- TELÉFONO -->

                            <div class="mb-3">

                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>

                                <input 
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    class="form-control"
                                    placeholder="Ingresá tu teléfono">

                            </div>


                            <!-- DOMICILIO -->

                            <div class="mb-3">

                                <label for="domicilio" class="form-label">
                                    Domicilio
                                </label>

                                <input 
                                    type="text"
                                    id="domicilio"
                                    name="domicilio"
                                    class="form-control"
                                    placeholder="Ingresá tu domicilio">

                            </div>


                            <!-- CONTRASEÑA -->

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Contraseña
                                </label>

                                <input 
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Ingresá una contraseña"
                                    required>

                            </div>


                            <!-- CONFIRMAR CONTRASEÑA -->

                            <div class="mb-4">

                                <label for="confirmarPassword" class="form-label">
                                    Confirmar contraseña
                                </label>

                                <input 
                                    type="password"
                                    id="confirmarPassword"
                                    name="confirmarPassword"
                                    class="form-control"
                                    placeholder="Repetí tu contraseña"
                                    required>

                            </div>


                            <!-- BOTÓN -->

                            <div class="d-grid">

                                <button 
                                    type="submit"
                                    class="btn btn-petto btn-lg">

                                    Crear mi cuenta

                                </button>

                            </div>

                        </form>


                        <!-- LOGIN -->

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                ¿Ya tenés una cuenta?

                                <a href="login.html" class="enlace-petto">
                                    Iniciar sesión
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container text-center">

            <h4 class="d-inline-flex align-items-center gap-2">
                <svg class="petto-logo-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="5.5" cy="7" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="11" cy="4.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="17" cy="5.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="20" cy="10" rx="2" ry="2.5"></ellipse>
                    <path d="M12 10c-3.5 0-7 4-7 7a3 3 0 0 0 4 2.8l3-1 3 1A3 3 0 0 0 19 17c0-3-3.5-7-7-7Z"></path>
                </svg>
                PETTO
            </h4>

            <p>EL CAMINO A CASA</p>

        </div>

    </footer>

<script src="js/registro.js"></script>

</body>

</html>
