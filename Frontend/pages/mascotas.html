    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <script>
        const API_MASCOTAS = "http://localhost:5174/api/Mascotas";
        const listaMascotas = document.getElementById("listaMascotas");

        // Recuperar la sesión, con o sin "Recordarme".
        const usuarioGuardado =
            localStorage.getItem("pettoUsuario") ||
            sessionStorage.getItem("pettoUsuario");

        let usuarioActual = null;

        try {
            if (usuarioGuardado) {
                usuarioActual = JSON.parse(usuarioGuardado);
            }
        } catch (error) {
            console.error("Error al recuperar la sesión:", error);
        }

        // Comprobar que exista un usuario autenticado con token.
        if (
            !usuarioActual ||
            !usuarioActual.idUsuario ||
            !usuarioActual.token
        ) {
            localStorage.removeItem("pettoUsuario");
            sessionStorage.removeItem("pettoUsuario");
            window.location.replace("login.html");
        } else {
            cargarMascotas();
        }

        async function cargarMascotas() {
            try {
                const respuesta = await fetch(API_MASCOTAS, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${usuarioActual.token}`
                    }
                });

                // Si la sesión venció o el token no es válido, volver al login.
                if (respuesta.status === 401 || respuesta.status === 403) {
                    localStorage.removeItem("pettoUsuario");
                    sessionStorage.removeItem("pettoUsuario");
                    window.location.replace("login.html");
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error(
                        "La API no pudo recuperar las mascotas. Código: " +
                        respuesta.status
                    );
                }

                const mascotas = await respuesta.json();

                // El backend ya devuelve únicamente las mascotas del usuario.
                listaMascotas.innerHTML = "";

                if (mascotas.length === 0) {
                    listaMascotas.innerHTML = `
                        <article class="mascota-card agregar-mascota">
                            <div class="agregar-icono">+</div>
                            <h2>Todavía no registraste mascotas</h2>
                            <p>Agregá tu primera mascota para organizar su información.</p>
                            <a href="registrarmascotas.html" class="btn-petto">
                                Registrar mascota
                            </a>
                        </article>
                    `;
                    return;
                }

                mascotas.forEach(mascota => {
                    const tarjeta = document.createElement("article");
                    tarjeta.className = "mascota-card";

                    const imagen = document.createElement("div");
                    imagen.className = "mascota-imagen";
                    imagen.textContent =
                        mascota.especie?.toLowerCase() === "gato"
                            ? "🐱"
                            : "🐶";

                    const informacion = document.createElement("div");
                    informacion.className = "mascota-info";

                    const estado = document.createElement("span");
                    estado.className = "estado-mascota";
                    estado.textContent = mascota.estado || "Registrada";

                    const nombre = document.createElement("h2");
                    nombre.textContent = mascota.nombre || "Sin nombre";

                    informacion.append(estado, nombre);

                    agregarDato(informacion, "Especie", mascota.especie);
                    agregarDato(informacion, "Raza", mascota.raza);
                    agregarDato(informacion, "Sexo", mascota.sexo);
                    agregarDato(informacion, "Color", mascota.color);

                    const botones = document.createElement("div");
                    botones.className = "mascota-botones";

                    const ver = document.createElement("a");
                    ver.href =
                        `mascota.html?id=${encodeURIComponent(mascota.idMascota)}`;
                    ver.className = "btn-dashboard";
                    ver.textContent = "Ver información";

                    botones.appendChild(ver);
                    informacion.appendChild(botones);

                    tarjeta.append(imagen, informacion);
                    listaMascotas.appendChild(tarjeta);
                });

                const agregar = document.createElement("article");
                agregar.className = "mascota-card agregar-mascota";
                agregar.innerHTML = `
                    <div class="agregar-icono">+</div>
                    <h2>¿Tenés otra mascota?</h2>
                    <p>Registrala para tener su información organizada en PETTO.</p>
                    <a href="registrar-mascotas.html" class="btn-petto">
                        Registrar mascota
                    </a>
                `;

                listaMascotas.appendChild(agregar);

            } catch (error) {
                console.error("Error al cargar las mascotas:", error);

                listaMascotas.innerHTML = `
                    <p class="alert alert-danger">
                        No se pudieron cargar las mascotas.
                        Verificá que el backend esté funcionando.
                    </p>
                `;
            }
        }

        function agregarDato(contenedor, etiqueta, valor) {
            if (valor === null || valor === undefined || valor === "") {
                return;
            }

            const parrafo = document.createElement("p");
            const titulo = document.createElement("strong");

            titulo.textContent = etiqueta + ": ";
            parrafo.append(titulo, document.createTextNode(valor));

            contenedor.appendChild(parrafo);
        }
    </script>
