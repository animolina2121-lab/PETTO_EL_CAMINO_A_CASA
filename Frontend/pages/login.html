<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | PETTO</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos de PETTO -->
    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


    <!-- =========================
         NAVEGACIÓN
    ========================== -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <!-- LOGO -->

            <a class="navbar-brand d-inline-flex align-items-center gap-2" href="index.html">

                <svg class="petto-logo-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="5.5" cy="7" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="11" cy="4.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="17" cy="5.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="20" cy="10" rx="2" ry="2.5"></ellipse>
                    <path d="M12 10c-3.5 0-7 4-7 7a3 3 0 0 0 4 2.8l3-1 3 1A3 3 0 0 0 19 17c0-3-3.5-7-7-7Z"></path>
                </svg>
                <span class="d-flex flex-column">
                    <span class="logo-petto">PETTO</span>
                    <small class="lema">EL CAMINO A CASA</small>
                </span>

                
            </a>


            <!-- VOLVER AL INICIO -->

            <a 
                href="index.html"
                class="btn btn-outline-petto">

                ← Volver al inicio

            </a>

        </div>

    </nav>



    <!-- =========================
         FORMULARIO LOGIN
    ========================== -->

    <main class="formulario-pagina">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="formulario-card">


                        <!-- ENCABEZADO -->

                        <div class="text-center mb-4">

                            <div class="formulario-icono">

                                🐾

                            </div>


                            <h1>

                                Bienvenido a PETTO

                            </h1>


                            <p>

                                Iniciá sesión para continuar

                            </p>

                        </div>



                        <!-- =========================
                             FORMULARIO
                        ========================== -->

                        <form id="formLogin">
                            <div id="mensajeLogin" class="alert d-none" role="alert"></div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label 
                                    for="email"
                                    class="form-label">

                                    Correo electrónico

                                </label>


                                <input 
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="ejemplo@correo.com"
                                    required>

                            </div>



                            <!-- CONTRASEÑA -->

                            <div class="mb-2">

                                <label 
                                    for="password"
                                    class="form-label">

                                    Contraseña

                                </label>


                                <input 
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Ingresá tu contraseña"
                                    required>

                            </div>



                            <!-- RECORDAR + RECUPERAR -->

                            <div class="d-flex justify-content-between align-items-center mb-4">


                                <div class="form-check">

                                    <input 
                                        type="checkbox"
                                        class="form-check-input"
                                        id="recordarme">

                                    <label 
                                        class="form-check-label"
                                        for="recordarme">

                                        Recordarme

                                    </label>

                                </div>


                                <a 
                                    href="#"
                                    class="enlace-petto">

                                    ¿Olvidaste tu contraseña?

                                </a>

                            </div>



                            <!-- BOTÓN LOGIN -->

                            <div class="d-grid">

                                <button 
                                    type="submit"
                                    class="btn btn-petto btn-lg">

                                    Iniciar sesión

                                </button>

                            </div>


                        </form>



                        <!-- =========================
                             REGISTRO
                        ========================== -->

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                ¿Todavía no tenés una cuenta?

                                <a 
                                    href="registro.html"
                                    class="enlace-petto">

                                    Registrarme

                                </a>

                            </p>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container text-center">

            <h4 class="d-inline-flex align-items-center gap-2">
                <svg class="petto-logo-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="5.5" cy="7" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="11" cy="4.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="17" cy="5.5" rx="2" ry="2.5"></ellipse>
                    <ellipse cx="20" cy="10" rx="2" ry="2.5"></ellipse>
                    <path d="M12 10c-3.5 0-7 4-7 7a3 3 0 0 0 4 2.8l3-1 3 1A3 3 0 0 0 19 17c0-3-3.5-7-7-7Z"></path>
                </svg>
                PETTO
            </h4>

            <p>
                EL CAMINO A CASA
            </p>

            <small>
                Proyecto Final - Programación II - 2026
            </small>

        </div>

    </footer>

    <script src="js/login.js"></script>

</body>

</html>
